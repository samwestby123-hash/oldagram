<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
            <img src="images/logo.png" class="logo">
            <img src="images/user-avatar.png" class="profile-picture">
            </header>
            
            <div class="breaker"></div>
            <main>
                <section class="post-information">
                    <img src="" class="author-photo profile-picture" id="avatar">
                    <p class="accent-text" id="name">  </p>
                    <p id="location"> </p>
                </section>
                
                <section class="post-content-space">
                    <img src="" class="post-content" id="post">
                </section>
                
                <section class="post-stats">
                    <div class="stats-nav">
                        <img src="images/icon-heart.png" class="interaction-icon">
                        <img src="images/icon-comment.png" class="interaction-icon">
                        <img src="images/icon-dm.png" class="interaction-icon">
                    </div>
                    <p class="accent-text" id="likes"> </p>
                    <p><span class="accent-text" id="username"> </span> <span id="comment"></span> </p>
                </section>
                
            </main>
        </div>
        <button class="next-post" id="next-post-btn"> Click to see next post</button>
        <script >const posts = [
    {
        name: "Vincent van Gogh",
        username: "vincey1853",
        location: "Zundert, Netherlands",
        avatar: "images/avatar-vangogh.jpg",
        post: "images/post-vangogh.jpg",
        comment: "just took a few mushrooms lol",
        likes: 21
    },
    {
        name: "Gustave Courbet",
        username: "gus1819",
        location: "Ornans, France",
        avatar: "images/avatar-courbet.jpg",
        post: "images/post-courbet.jpg",
        comment: "i'm feelin a bit stressed tbh",
        likes: 4
    },
        {
        name: "Joseph Ducreux",
        username: "jd1735",
        location: "Paris, France",
        avatar: "images/avatar-ducreux.jpg",
        post: "images/post-ducreux.jpg",
        comment: "gm friends! which coin are YOU stacking up today?? post below and WAGMI!",
        likes: 152
    }
]

const nameText = document.getElementById("name")
const usernameText = document.getElementById("username")
const locationText = document.getElementById("location")
const avatarText = document.getElementById("avatar")
const postText = document.getElementById("post")
const commentText = document.getElementById("comment")
const likesText = document.getElementById("likes")
const nextPostBtn = document.getElementById("next-post-btn")

let nextPost = 0

nextPostBtn.addEventListener("click", function(){
    renderNextPost()
})

function renderNextPost() {
    nameText.innerHTML= posts[nextPost].name
    usernameText.innerHTML = posts[nextPost].username
    locationText.innerHTML = posts[nextPost].location
    
    avatarText.src = posts[nextPost].avatar
    
    postText.src = posts[nextPost].post
    commentText.innerHTML = posts[nextPost].comment
    likesText.innerHTML = `${posts[nextPost].likes} likes`
    nextPost += 1
    if (nextPost > posts.length - 1) {
        nextPost = 0
    }
}

renderNextPost()</script>
    </body>
</html>
